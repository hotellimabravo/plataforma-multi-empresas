<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
	<title>Acesso ao Sistema - Lava Jato</title>
	<link rel="stylesheet" href="style.css" />
	<link rel="manifest" href="manifest.json" />
	<link rel="icon" type="image/svg+xml" href="icon.svg" />
	<link rel="apple-touch-icon" href="apple-touch-icon.png" />
	<meta name="theme-color" content="#0f172a" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Gestão SaaS" />
	<script type="module" src="js/auth-service.js"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
		
		body {
			background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
		}
		.login-wrapper {
		    width: 100%;
		    max-width: 420px;
		    padding: 20px;
		}
		.login-card {
			background: #ffffff;
			width: 100%;
			padding: 48px 40px;
			border-radius: 24px;
			box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.05);
			text-align: center;
			position: relative;
			overflow: hidden;
		}
		.login-card::before {
		    content: '';
		    position: absolute;
		    top: 0;
		    left: 0;
		    width: 100%;
		    height: 6px;
		    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
		}
		.login-logo {
			font-size: 3.5rem;
			margin-bottom: 20px;
			display: inline-block;
			background: #f8fafc;
			width: 80px;
			height: 80px;
			line-height: 80px;
			border-radius: 20px;
			box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
		}
		.login-title {
			font-size: 1.75rem;
			font-weight: 800;
			color: #0f172a;
			margin: 0 0 8px 0;
			letter-spacing: -0.02em;
		}
		.login-subtitle {
			font-size: 1rem;
			color: #64748b;
			margin: 0 0 32px 0;
		}
		.form-group {
			text-align: left;
			margin-bottom: 20px;
		}
		.form-group label {
		    display: block;
		    font-size: 0.875rem;
		    font-weight: 600;
		    color: #334155;
		    margin-bottom: 8px;
		}
		.form-group input {
		    width: 100%;
		    padding: 12px 16px;
		    font-size: 1rem;
		    color: #0f172a;
		    background: #f8fafc;
		    border: 2px solid #e2e8f0;
		    border-radius: 12px;
		    transition: all 0.2s ease;
		    box-sizing: border-box;
		    font-family: inherit;
		}
		.form-group input:focus {
		    outline: none;
		    border-color: #3b82f6;
		    background: #ffffff;
		    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
		}
		.form-group input::placeholder {
		    color: #94a3b8;
		}
		.btn-login {
			width: 100%;
			padding: 14px;
			font-size: 1.05rem;
			font-weight: 600;
			margin-top: 12px;
			background: #3b82f6;
			color: white;
			border: none;
			border-radius: 12px;
			cursor: pointer;
			transition: all 0.2s;
			font-family: inherit;
		}
		.btn-login:hover {
		    background: #2563eb;
		    transform: translateY(-1px);
		    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
		}
		.btn-login:disabled {
		    background: #94a3b8;
		    cursor: not-allowed;
		    transform: none;
		    box-shadow: none;
		}
		.error-msg {
			color: #b91c1c;
			background: #fef2f2;
			border: 1px solid #fecaca;
			padding: 12px;
			border-radius: 12px;
			font-size: 0.9rem;
			font-weight: 500;
			margin-bottom: 24px;
			display: none;
			animation: shake 0.4s ease-in-out;
		}
		@keyframes shake {
		    0%, 100% { transform: translateX(0); }
		    25% { transform: translateX(-4px); }
		    75% { transform: translateX(4px); }
		}
	</style>
</head>
<body>
	<div class="login-wrapper"><div class="login-card">
		<div class="login-logo">🛠️</div>
		<h1 class="login-title">Acesso Restrito</h1>
		<p class="login-subtitle">Faça login para continuar</p>
		<div style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; color: #15803d; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 999px; padding: 4px 12px; margin-bottom: 20px;">
			<span>🛡️ Autenticação Criptografada (PBKDF2 + HMAC)</span>
		</div>

		<div id="loginError" class="error-msg">Usuário ou senha incorretos.</div>

		<form id="formLogin">
			<div class="form-group">
				<label for="inputUser">Usuário</label>
				<input type="text" id="inputUser" required placeholder="Digite seu usuário" autocomplete="username" />
			</div>
			<div class="form-group">
				<label for="inputPass">Senha</label>
				<div style="position: relative; display: flex; align-items: center;">
					<input type="password" id="inputPass" required placeholder="Digite sua senha" autocomplete="current-password" style="padding-right: 42px;" />
					<button type="button" id="btnToggleLoginPass" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #64748b; padding: 4px;" title="Mostrar ou ocultar senha">👁️</button>
				</div>
			</div>
			<button type="submit" class="btn btn-primary btn-login">Entrar</button>
		</form>
	</div></div>

	<script type="module">
		import AuthService from './js/auth-service.js';

		const inputPass = document.getElementById('inputPass');
		const btnToggle = document.getElementById('btnToggleLoginPass');
		if (btnToggle && inputPass) {
			btnToggle.addEventListener('click', () => {
				const isPassword = inputPass.type === 'password';
				inputPass.type = isPassword ? 'text' : 'password';
				btnToggle.textContent = isPassword ? '🙈' : '👁️';
				btnToggle.title = isPassword ? 'Ocultar senha' : 'Ver senha';
			});
		}

		document.getElementById('formLogin').addEventListener('submit', async (e) => {
			e.preventDefault();
			const user = document.getElementById('inputUser').value;
			const pass = document.getElementById('inputPass').value;
			const btn = document.querySelector('.btn-login');
			const errorBox = document.getElementById('loginError');
			
			btn.disabled = true;
			btn.textContent = 'Autenticando...';
			errorBox.style.display = 'none';

			try {
				const success = await AuthService.login(user, pass);
				if (success) {
					window.location.href = 'index.html';
				} else {
					errorBox.style.display = 'block';
					btn.disabled = false;
					btn.textContent = 'Entrar';
				}
			} catch (err) {
				console.error(err);
				errorBox.textContent = 'Erro ao fazer login.';
				errorBox.style.display = 'block';
				btn.disabled = false;
				btn.textContent = 'Entrar';
			}
		});
	</script>
</body>
</html>
